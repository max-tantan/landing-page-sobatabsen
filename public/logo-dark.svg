<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 56" width="256" height="56" fill="none">
  <title>SobatAbsen Logo</title>
  <defs>
    <linearGradient id="sbLogoBg" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#227eff"/>
      <stop offset="100%" stop-color="#0a53bf"/>
    </linearGradient>
    <linearGradient id="sbLogoGlow" x1="0" y1="0" x2="0" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Logomark (44x44) positioned at (6, 6) -->
  <g transform="translate(6, 6)">
    <rect width="44" height="44" rx="11" fill="url(#sbLogoBg)"/>
    <rect x="0.5" y="0.5" width="43" height="43" rx="10.5" stroke="url(#sbLogoGlow)" stroke-width="1"/>
    
    <!-- 3 Viewfinder Brackets -->
    <path d="M 10.5 16.5 V 13 C 10.5 11.6 11.6 10.5 13 10.5 H 16.5" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 10.5 27.5 V 31 C 10.5 32.4 11.6 33.5 13 33.5 H 16.5" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M 27.5 33.5 H 31 C 32.4 33.5 33.5 32.4 33.5 31 V 27.5" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2.2" stroke-linecap="round"/>

    <!-- Sparkle ✳ in Top-Right -->
    <g transform="translate(30, 13)">
      <line x1="0" y1="-3.6" x2="0" y2="3.6" stroke="#ffb15c" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="-3.6" y1="0" x2="3.6" y2="0" stroke="#ffb15c" stroke-width="1.6" stroke-linecap="round"/>
      <line x1="-2.5" y1="-2.5" x2="2.5" y2="2.5" stroke="#ffb15c" stroke-width="1.3" stroke-linecap="round"/>
      <line x1="-2.5" y1="2.5" x2="2.5" y2="-2.5" stroke="#ffb15c" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="0.9" fill="#ffffff"/>
    </g>

    <!-- Verified Presence Checkmark -->
    <path d="M 14.5 22.5 L 19.5 27.5 L 30 16.5" stroke="#ffffff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography: "sobatabsen" -->
  <text x="62" y="36.5" font-family="'Manrope', 'Nunito Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="800" letter-spacing="-1.2">
    <tspan fill="#ffffff">sobat</tspan><tspan fill="#1878ec">absen</tspan>
  </text>
  
  <!-- Accent Sparkle next to brand text -->
  <g transform="translate(210, 18)">
    <line x1="0" y1="-4.2" x2="0" y2="4.2" stroke="#ffb15c" stroke-width="2" stroke-linecap="round"/>
    <line x1="-4.2" y1="0" x2="4.2" y2="0" stroke="#ffb15c" stroke-width="2" stroke-linecap="round"/>
    <line x1="-3" y1="-3" x2="3" y2="3" stroke="#ffb15c" stroke-width="1.6" stroke-linecap="round"/>
    <line x1="-3" y1="3" x2="3" y2="-3" stroke="#ffb15c" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>