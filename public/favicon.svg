<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <title>SobatAbsen Favicon</title>
  <defs>
    <linearGradient id="sbFavGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e7eff"/>
      <stop offset="100%" stop-color="#0953bf"/>
    </linearGradient>
    <linearGradient id="sbFavGlow" x1="0" y1="0" x2="0" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="32" height="32" rx="8" fill="url(#sbFavGrad)"/>
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="url(#sbFavGlow)" stroke-width="1"/>

  <!-- 3 QR Scanner Viewfinder Corners -->
  <!-- Top-Left -->
  <path d="M 7.5 12 V 9.5 C 7.5 8.4 8.4 7.5 9.5 7.5 H 12" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Bottom-Left -->
  <path d="M 7.5 20 V 22.5 C 7.5 23.6 8.4 24.5 9.5 24.5 H 12" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Bottom-Right -->
  <path d="M 20 24.5 H 22.5 C 23.6 24.5 24.5 23.6 24.5 22.5 V 20" stroke="#ffffff" stroke-opacity="0.55" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Top-Right: Sobat Sparkle ✳ in Brand Amber/Gold -->
  <g transform="translate(22, 9.5)">
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#ffb15c" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-3" y1="0" x2="3" y2="0" stroke="#ffb15c" stroke-width="1.4" stroke-linecap="round"/>
    <line x1="-2.1" y1="-2.1" x2="2.1" y2="2.1" stroke="#ffb15c" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="-2.1" y1="2.1" x2="2.1" y2="-2.1" stroke="#ffb15c" stroke-width="1.2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="0.75" fill="#ffffff"/>
  </g>

  <!-- Central Verified Presence Checkmark -->
  <path d="M 10.5 16.5 L 14.2 20.2 L 21.8 12.2" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
</svg>