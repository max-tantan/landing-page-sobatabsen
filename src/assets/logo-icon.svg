<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <title>SobatAbsen Icon</title>
  <defs>
    <linearGradient id="sbIconBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2582ff"/>
      <stop offset="50%" stop-color="#1878ec"/>
      <stop offset="100%" stop-color="#0a50b8"/>
    </linearGradient>
    <linearGradient id="sbIconGlow" x1="0" y1="0" x2="0" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="sbIconShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#083882" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Squircle Base with soft shadow -->
  <rect width="64" height="64" rx="16" fill="url(#sbIconBg)" filter="url(#sbIconShadow)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="url(#sbIconGlow)" stroke-width="1.5"/>

  <!-- 3 QR Scanner Viewfinder Corners -->
  <!-- Top-Left -->
  <path d="M 15 24 V 19 C 15 16.8 16.8 15 19 15 H 24" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Bottom-Left -->
  <path d="M 15 40 V 45 C 15 47.2 16.8 49 19 49 H 24" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3.2" stroke-linecap="round"/>
  <!-- Bottom-Right -->
  <path d="M 40 49 H 45 C 47.2 49 49 47.2 49 45 V 40" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3.2" stroke-linecap="round"/>

  <!-- Top-Right: Signature Sobat Sparkle ✳ in Brand Gold -->
  <g transform="translate(44, 19)">
    <line x1="0" y1="-5.5" x2="0" y2="5.5" stroke="#ffb15c" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="-5.5" y1="0" x2="5.5" y2="0" stroke="#ffb15c" stroke-width="2.4" stroke-linecap="round"/>
    <line x1="-3.9" y1="-3.9" x2="3.9" y2="3.9" stroke="#ffb15c" stroke-width="2" stroke-linecap="round"/>
    <line x1="-3.9" y1="3.9" x2="3.9" y2="-3.9" stroke="#ffb15c" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="1.4" fill="#ffffff"/>
  </g>

  <!-- Central Verified Presence Checkmark -->
  <path d="M 21 33 L 28.5 40.5 L 43.5 24.5" stroke="#ffffff" stroke-width="5.2" stroke-linecap="round" stroke-linejoin="round"/>
</svg>